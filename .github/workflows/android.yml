name: Android

# Builds the sideloadable debug APK. There is no app-store release path by
# design — download the artifact and `adb install -r` it.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      # Android Gradle Plugin 8.7 does not support JDK 26; 21 is the newest
      # release it builds against cleanly.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: 5-wild-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
